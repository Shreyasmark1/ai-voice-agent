[project]
name = "voice-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pipecat-ai[google,openrouter,sarvam]>=1.0.0",
]

[project.scripts]
voice-agent = "voice_agent.main:main"
voice-agent-dev = "voice_agent.main:main_dev"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
